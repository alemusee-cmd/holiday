- hosts: webservers
  vars:
    image_name: "wubdigitalinfo/holiday-app"
  tasks:
    - name: Get currently running image tag (for rollback)
      shell: |
        docker inspect --format '{% raw %}{{.Config.Image}}{% endraw %}' holiday-container 2>/dev/null || echo "none"
      register: current_image
      ignore_errors: true

    - name: Save current tag to file for potential rollback
      copy:
        content: "{{ current_image.stdout | default('none') }}"
        dest: /tmp/last_good_image.txt
      when: current_image.stdout is defined and current_image.stdout != "none"

    - name: Pull latest Docker image
      docker_image:
        name: "{{ image_name }}"
        tag: "{{ image_tag | default('latest') }}"
        source: pull

    - name: Stop and remove old container if it exists
      docker_container:
        name: holiday-container
        state: absent

    - name: Run new container
      docker_container:
        name: holiday-container
        image: "{{ image_name }}:{{ image_tag | default('latest') }}"
        state: started
        restart_policy: always
        ports:
          - "3000:3000"
